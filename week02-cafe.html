<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛の CAFE メニュー</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="bg-orange-200">
    <header class="bg-white shadow px-6 py-4">
      <h1 class="text-2xl font-bold text-orange-200">愛の CAFE</h1>
      <p class="text-gray-600 text-sm mt-1">埼玉県初上陸！！</p>
    </header>

    <main class="max-w-2xl mx-auto px-4 py-8">
      <section class="mb-8">
        <h2 class="text-center text-xl font-bold text-pink-800 mb-4">ドリンク</h2>

        <div class="bg-white rounded-lg shadow p-6 mb-4">
          <h3 class="text-lg font-bold text-green-800">抹茶ラテ</h3>
          <p class="text-gray-600 mt-1 hover:text-green-800">深い苦味が美味しい。</p>
          <p class="text-blue-600 font-bold mt-2">600円</p>
        </div>

        <div class="bg-white rounded-lg shadow p-6 mb-4">
          <h3 class="text-lg font-bold text-brown-900">ほうじ茶ラテ</h3>
          <p class="text-gray-600 mt-1 ">香りが良い。</p>
          <p class="text-blue-600 font-bold mt-2">700円</p>
        </div>
      </section>
      <section class="mb-8">
        <h2 class="text-center text-xl font-bold text-pink-800 mb-4">フード</h2>
        <div class="bg-white rounded-lg shadow p-6 mb-4">
          <h3 class="text-lg font-bold text-green-800">抹茶クッキー</h3>
          <p class="text-gray-600 mt-1 hover:text-green-800">ふわふわのクッキー。</p>
          <p class="text-blue-600 font-bold mt-2">300円</p>
        </div>
        <div class="bg-white rounded-lg shadow p-6 mb-4">
          <h3 class="text-lg font-bold text-brown-900">ほうじ茶アイス</h3>
          <p class="text-gray-600 mt-1 hover:text-brown-900">暑い夏にぴったり！</p>
          <p class="text-blue-600 font-bold mt-2">200円</p>
        </div>
      </section>
    </main>

    <footer class="bg-gray-100 text-center py-6 text-gray-500 text-sm">
      <p> 愛の CAFE</p>
    </footer>
  </body>
</html>
