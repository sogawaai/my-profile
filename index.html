<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sogawa ai のプロフィールページ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-slate-100 to-indigo-50 text-slate-800 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full text-center border border-white/40 backdrop-blur-sm">
    
    <h1 class="text-3xl font-black text-indigo-600 tracking-tight mb-2">
      sogawa ai
    </h1>
    
    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">
      Profile Page
    </p>

    <div class="mb-8 text-left bg-slate-50 p-4 rounded-2xl">
      <h2 class="text-xs font-bold text-slate-500 mb-3 flex items-center gap-1">
        ✨ 好きなこと
      </h2>
      <div class="flex flex-wrap gap-2">
        <span class="bg-indigo-100 text-indigo-700 text-xs font-semibold px-3 py-1.5 rounded-xl">💻 プログラミング</span>
        <span class="bg-emerald-100 text-emerald-700 text-xs font-semibold px-3 py-1.5 rounded-xl">☕ カフェ巡り</span>
        <span class="bg-amber-100 text-amber-700 text-xs font-semibold px-3 py-1.5 rounded-xl">🎵 音楽</span>
      </div>
    </div>

    <div class="pt-2">
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" 
         class="inline-block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-2xl transition duration-200 shadow-lg shadow-indigo-200">
        GitHub を見に行く
      </a>
    </div>

  </div>

</body>
</html>
