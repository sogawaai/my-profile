<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>sogawa ai のプロフィールページ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-tr from-slate-100 to-indigo-50 text-slate-800 flex items-center justify-center min-h-screen p-4">

  <div class="bg-white p-8 rounded-3xl shadow-xl max-w-sm w-full text-center border border-white/40 backdrop-blur-sm">
    
    <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=150&auto=format&fit=crop&q=80" 
         alt="sogawa aiのプロフィール写真" 
         class="w-24 h-24 rounded-full mx-auto mb-4 object-cover ring-4 ring-indigo-100 shadow-md">

    <h1 class="text-3xl font-black text-indigo-600 tracking-tight mb-1">
      sogawa ai
    </h1>
    
    <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-6">
      Profile Page
    </p>

    <div class="mb-6 text-left bg-slate-50 p-5 rounded-2xl border border-slate-100">
      <h2 class="text-xs font-bold text-slate-500 mb-3 flex items-center gap-1">
        ✨ 好きなことリスト
      </h2>
      
      <ul class="space-y-2 text-sm text-slate-600 font-medium">
        <li class="flex items-center gap-2 bg-white px-3 py-2 rounded-xl shadow-sm border border-slate-100">
          <span class="text-indigo-500">💻</span> プログラミングを学ぶこと
        </li>
        <li class="flex items-center gap-2 bg-white px-3 py-2 rounded-xl shadow-sm border border-slate-100">
          <span class="text-emerald-500">☕</span> おしゃれなカフェ巡り
        </li>
        <li class="flex items-center gap-2 bg-white px-3 py-2 rounded-xl shadow-sm border border-slate-100">
          <span class="text-amber-500">🎵</span> お気に入りの音楽を聴くこと
        </li>
      </ul>
    </div>

    <div class="pt-2">
      <a href="https://github.com" target="_blank" rel="noopener noreferrer" 
         class="inline-block w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-2xl transition duration-200 shadow-lg shadow-indigo-200">
        GitHub を見に行く
      </a>
    </div>

  </div>

</body>
</html>
